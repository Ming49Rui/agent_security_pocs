# 子集复现：工具型主注入实验（论文表 1，DeepSeek 家族）。
# 4 个数据集（Behavior/Agent × 有/无预存记忆） × 3 攻击 × 2 模型 × limit 10。
# 模型由 shouxu.tech 的 OpenAI 兼容端点提供。
name: local-tool-based-subset
output_dir: .artifacts/local/tool_based_subset

datasets:
  - label: behavior-true-optimized-with-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: behavior-true-optimized-without-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_without_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-with-memories
    dataset_file: datasets/released/generated/agent_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-without-memories
    dataset_file: datasets/released/generated/agent_true_optimized_without_memories.json
    evaluation_mode: attack

attacks:
  - label: literature-baseline
    attack: attack_from_literature
    defense_labels: [no-defense]
  - label: actor-critic-no-markers
    attack: universal_v2_optimized_without_markers
    defense_labels: [no-defense]
  - label: actor-critic-with-untrusted-markers
    attack: universal_v2_optimized_with_markers
    defense_labels: [no-defense]

memory_backend: tool
mention_memory_system: true
grader_model: openai/deepseek-v4-flash-0731

scoring:
  during_eval: none
  post_eval_scorers:
    - tool_call_scorer
    - goal_match_scorer
  post_eval_action: overwrite

retry:
  retry_attempts: 10
  retry_immediate: true
  retry_wait: 30
  retry_connections: 1.0
  retry_on_error: 2

eval:
  limit: 10
  max_tasks: 3
  max_connections: 4
  fail_on_error: false
  bundle: true
  bundle_overwrite: true
  max_retries: 5
  attempt_timeout: 600

models:
  - label: deepseek-v4-flash-0731
    model: openai/deepseek-v4-flash-0731
    prompt_model: deepseek-v4-flash-0731
    provider: generic
  - label: deepseek-v4-pro
    model: openai/deepseek-v4-pro
    prompt_model: deepseek-v4-pro
    provider: generic

defenses:
  - label: no-defense
    defense: ""