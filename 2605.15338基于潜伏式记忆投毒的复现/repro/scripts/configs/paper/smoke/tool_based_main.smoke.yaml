name: paper-tool-based-main-smoke
output_dir: .artifacts/paper/smoke/tool_based_main

datasets:
  - label: behavior-true-optimized-with-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: behavior-true-optimized-without-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_without_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-with-memories
    dataset_file: datasets/released/generated/agent_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-without-memories
    dataset_file: datasets/released/generated/agent_true_optimized_without_memories.json
    evaluation_mode: attack

attacks:
  - label: literature-baseline
    attack: attack_from_literature
    defense_labels:
      - no-defense
  - label: actor-critic-no-markers
    attack: universal_v2_optimized_without_markers
  - label: actor-critic-with-untrusted-markers
    attack: universal_v2_optimized_with_markers

memory_backend: tool
mention_memory_system: true
grader_model: openai/gpt-5.4-mini

scoring:
  during_eval: none
  post_eval_scorers:
    - tool_call_scorer
    - goal_match_scorer
  post_eval_action: overwrite

retry:
  retry_attempts: 10
  retry_immediate: true
  retry_wait: 30
  retry_connections: 1.0
  retry_on_error: 2

eval:
  limit: 2
  max_tasks: 2
  max_connections: 8
  fail_on_error: false
  bundle: true
  bundle_overwrite: true
  max_retries: 5
  attempt_timeout: 600

models:
  - label: gpt-5.4
    model: openai/gpt-5.4
    provider: gpt
  - label: gpt-5.5
    model: openai/gpt-5.5
    provider: gpt
  - label: claude-sonnet-4.6
    model: anthropic/claude-sonnet-4-6
    provider: claude
    reasoning_effort: high
  - label: gemini-3.1-pro-preview
    model: openrouter/google/gemini-3.1-pro-preview
    provider: gemini
    reasoning_effort: high
    extra_body:
      provider:
        only:
          - google-ai-studio
        allow_fallbacks: false
  - label: kimi-k2.6
    model: openrouter/moonshotai/kimi-k2.6
    provider: generic
  - label: deepseek-v4-pro
    model: openai-api/deepseek/deepseek-v4-pro
    provider: generic
    prompt_model: deepseek-v4-pro

defenses:
  - label: no-defense
    defense: ""
  - label: system-prompt-hardening
    defense: system_prompt_hardening
  - label: untrusted-content-markers
    defense: untrusted_content_markers
  - label: system-hardening-plus-markers
    defense: system_prompt_hardening,untrusted_content_markers
  - label: gepa-prompt-hardening-suffix
    defense: gepa_prompt_hardening_suffix
