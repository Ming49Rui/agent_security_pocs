name: paper-provider-setup-swap-ablation
output_dir: .artifacts/paper/provider_setup_swap_ablation

datasets:
  - label: provider-setup-swap-true-opt-100
    dataset_file: experiments/provider_setup_swap_ablation/data/merged_eval_in_provider_setup_swap_true_opt_100_seed_20260507.json
    evaluation_mode: attack

attacks:
  - label: actor-critic-no-markers
    attack: universal_v2_optimized_without_markers

memory_backend: tool
mention_memory_system: true
grader_model: openai/gpt-5.4-mini

scoring:
  during_eval: none
  post_eval_scorers:
    - tool_call_scorer
    - goal_match_scorer
  post_eval_action: overwrite

retry:
  retry_attempts: 10
  retry_immediate: true
  retry_wait: 30
  retry_connections: 1.0
  retry_on_error: 2

eval:
  max_tasks: 6
  max_connections: 6
  fail_on_error: false
  bundle: true
  bundle_overwrite: true
  max_retries: 5
  attempt_timeout: 600

models:
  - label: gpt-5.5__gpt-setup
    model: openai/gpt-5.5
    prompt_model: openai/gpt-5.5
    provider: gpt
  - label: gpt-5.5__claude-setup
    model: openai/gpt-5.5
    prompt_model: anthropic/claude-sonnet-4-6
    provider: claude
  - label: gpt-5.5__gemini-setup
    model: openai/gpt-5.5
    prompt_model: openrouter/google/gemini-3.1-pro-preview
    provider: gemini

  - label: claude-sonnet-4.6__claude-setup
    model: anthropic/claude-sonnet-4-6
    prompt_model: anthropic/claude-sonnet-4-6
    provider: claude
    reasoning_effort: high
  - label: claude-sonnet-4.6__gpt-setup
    model: anthropic/claude-sonnet-4-6
    prompt_model: openai/gpt-5.5
    provider: gpt
    reasoning_effort: high
  - label: claude-sonnet-4.6__gemini-setup
    model: anthropic/claude-sonnet-4-6
    prompt_model: openrouter/google/gemini-3.1-pro-preview
    provider: gemini
    reasoning_effort: high

  - label: gemini-3.1-pro-preview__gemini-setup
    model: openrouter/google/gemini-3.1-pro-preview
    prompt_model: openrouter/google/gemini-3.1-pro-preview
    provider: gemini
    reasoning_effort: high
    extra_body:
      provider:
        only:
          - google-ai-studio
        allow_fallbacks: false
  - label: gemini-3.1-pro-preview__gpt-setup
    model: openrouter/google/gemini-3.1-pro-preview
    prompt_model: openai/gpt-5.5
    provider: gpt
    reasoning_effort: high
    extra_body:
      provider:
        only:
          - google-ai-studio
        allow_fallbacks: false
  - label: gemini-3.1-pro-preview__claude-setup
    model: openrouter/google/gemini-3.1-pro-preview
    prompt_model: anthropic/claude-sonnet-4-6
    provider: claude
    reasoning_effort: high
    extra_body:
      provider:
        only:
          - google-ai-studio
        allow_fallbacks: false

defenses:
  - label: no-defense
    defense: ""
