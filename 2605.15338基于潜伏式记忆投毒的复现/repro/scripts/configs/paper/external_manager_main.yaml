name: paper-external-manager-main
output_dir: .artifacts/paper/external_manager_main

datasets:
  - label: behavior-true-optimized-with-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: behavior-true-optimized-without-memories
    dataset_file: datasets/released/generated/behaviour_true_optimized_without_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-with-memories
    dataset_file: datasets/released/generated/agent_true_optimized_with_memories.json
    evaluation_mode: attack
  - label: agent-true-optimized-without-memories
    dataset_file: datasets/released/generated/agent_true_optimized_without_memories.json
    evaluation_mode: attack

attacks:
  - label: literature-baseline
    attack: attack_from_literature
  - label: actor-critic-loop
    attack: mem0_external_prompt_leak_without_untrusted_markers

memory_backend: mem0
mention_memory_system: true
mem0_runtime: prompt_only
mem0_provider: gemini
mem0_model: gemini-3.1-flash-lite-preview
mem0_prompt_variant: mem0_default
mem0_include_document_content: false
mem0_thinking: enabled
mem0_reasoning_effort: high
mem0_qdrant_mode: local

grader_model: openai/gpt-5.4-mini

scoring:
  during_eval: none
  post_eval_scorers:
    - mem0_write_scorer
    - mem0_goal_match_scorer
  post_eval_action: overwrite

retry:
  retry_attempts: 8
  retry_immediate: true
  retry_wait: 30
  retry_connections: 1.0
  retry_on_error: 2

eval:
  max_tasks: 6
  max_connections: 2
  fail_on_error: false
  bundle: true
  bundle_overwrite: true
  max_retries: 5
  attempt_timeout: 600

models:
  - label: gpt-5.4
    model: openai/gpt-5.4
    provider: gpt
  - label: gpt-5.5
    model: openai/gpt-5.5
    provider: gpt
  - label: claude-sonnet-4.6
    model: anthropic/claude-sonnet-4-6
    provider: claude
    reasoning_effort: high
  - label: gemini-3.1-pro-preview
    model: openrouter/google/gemini-3.1-pro-preview
    provider: gemini
    reasoning_effort: high
    extra_body:
      provider:
        only:
          - google-ai-studio
        allow_fallbacks: false
  - label: kimi-k2.6
    model: openrouter/moonshotai/kimi-k2.6
    provider: generic
  - label: deepseek-v4-pro
    model: openai-api/deepseek/deepseek-v4-pro
    provider: generic
    prompt_model: deepseek-v4-pro

defenses:
  - label: no-defense
    defense: ""
